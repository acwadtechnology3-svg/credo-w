    <script>
      (function () {
        var k = 'credo-locale', lk = 'credo-landing-locale', l, rtl = { ar: 1, fa: 1 };
        try {
          l = localStorage.getItem(k) || localStorage.getItem(lk);
        } catch (e) {}
        l = l || 'ar';
        var d = rtl[l] ? 'rtl' : 'ltr';
        document.documentElement.lang = l;
        document.documentElement.dir = d;
        document.documentElement.classList.add(d);
      })();
    </script>
